                    <dialog class="mdl-dialog">
                        <h4 class="mdl-dialog__title">Host Room</h4>
                        <div class="mdl-dialog__content">
                          <p>
                            Do you want to host a room?.
                          </p>
                        </div>
                        <div class="mdl-dialog__actions">
                          <button type="button" class="mdl-button agree">Agree</button>
                          <button type="button" class="mdl-button close">Disagree</button>
                        </div>
                      </dialog>
                      
                      <dialog class="mdl-dialog" id="mdl-dialogH">
                        
                      </dialog>

                      <dialog class="mdl-dialog" id="mdl-dialog2">
                        <h4 class="mdl-dialog__title">Join Room</h4>
                        <div class="mdl-dialog__content">
                          <p>
                            Please enter the code to join the room.
                          </p>

                          <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label is-upgraded is-dirty" data-upgraded=",MaterialTextfield">
                            <input class="mdl-textfield__input" type="text" id="joinCode" pattern="^(?:(?:^| )\S+ *){3,}$" required="">
                            <label class="mdl-textfield__label" for="joinCode">Join Code:</label> <span class="mdl-textfield__error">Please put in your code</span> </div>
                       
                        <div class="mdl-dialog__actions">
                          <button type="button" class="mdl-button agree">Join</button>
                          <button type="button" class="mdl-button close">Cancel</button>
                        </div>
                      </dialog>

                      

                      <dialog class="mdl-dialog" id="mdl-dialogS">
                        <h4 class="mdl-dialog__title" style="text-align: center;" id="mdl-dialog__titleS">Search</h4>
                        <div class="mdl-dialog__content" id="mdl-dialog__contentS">
                            
                            <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label is-upgraded is-dirty" data-upgraded=",MaterialTextfield">
                                <input class="mdl-textfield__input" type="text" id="pickupLocation" pattern="^(?:(?:^| )\S+ *){3,}$" required="">
                                <label class="mdl-textfield__label" for="pickupLocation">Start:</label> <span class="mdl-textfield__error">Please put in your start location</span> </div>
                                
                                
        
                                <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label is-upgraded is-dirty" data-upgraded=",MaterialTextfield">
                                    <input class="mdl-textfield__input" type="text" id="destinationLocation" pattern="^(?:(?:^| )\S+ *){3,}$" required="">
                                    <label class="mdl-textfield__label" for="destinationLocation">End:</label> <span class="mdl-textfield__error">Please put in your destination</span> </div>
                                
                        </div>
